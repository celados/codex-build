id: wake-parent-from-session-completion
language: rust
rule:
  pattern: |
    InterAgentCommunication::new(
        $CHILD,
        $PARENT,
        Vec::new(),
        $MESSAGE,
        /*trigger_turn*/ false,
    )
  inside:
    pattern: async fn forward_child_completion_to_parent($$$PARAMS) { $$$BODY }
    stopBy: end
fix: |
  InterAgentCommunication::new(
      $CHILD,
      $PARENT,
      Vec::new(),
      $MESSAGE,
      /*trigger_turn*/ true,
  )
