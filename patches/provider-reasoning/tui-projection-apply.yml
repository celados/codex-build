id: codex-build-tui-reasoning-confirmation-projection
language: Rust
message: Preserve model/list confirmation metadata in TUI model presets.
rule:
  pattern: |-
    ReasoningEffortPreset {
        effort: effort.reasoning_effort,
        description: effort.description,
    }
fix: |-
  ReasoningEffortPreset {
      effort: effort.reasoning_effort,
      description: effort.description,
      requires_confirmation: effort.requires_confirmation,
  }
