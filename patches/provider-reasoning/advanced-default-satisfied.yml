id: codex-build-advanced-reasoning-popup-default-confirmation-satisfied
language: Rust
message: Default-only confirmation choices use provider metadata.
rule:
  pattern: |-
    if choices.is_empty()
        && Self::reasoning_effort_requires_confirmation(
            &preset,
            &preset.default_reasoning_effort,
        )
    {
        choices.push(preset.default_reasoning_effort.clone());
    }
