id: codex-build-reasoning-popup-confirmation-partition
language: Rust
message: Partition the normal reasoning popup using provider confirmation metadata.
rule:
  pattern: |-
    let (choices, advanced_choices): (Vec<_>, Vec<_>) = all_choices
        .into_iter()
        .partition(|effort| !Self::is_advanced_reasoning_effort(effort));
fix: |-
  let (choices, advanced_choices): (Vec<_>, Vec<_>) = all_choices
      .into_iter()
      .partition(|effort| !Self::reasoning_effort_requires_confirmation(&preset, effort));
