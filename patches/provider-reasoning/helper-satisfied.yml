id: codex-build-reasoning-confirmation-helper-satisfied
language: Rust
message: Confirmation metadata falls back to the built-in advanced-effort rule.
rule:
  pattern: |-
    pub(super) fn reasoning_effort_requires_confirmation(
        preset: &ModelPreset,
        effort: &ReasoningEffortConfig,
    ) -> bool {
        preset
            .supported_reasoning_efforts
            .iter()
            .find(|option| &option.effort == effort)
            .and_then(|option| option.requires_confirmation)
            .unwrap_or_else(|| Self::is_advanced_reasoning_effort(effort))
    }
