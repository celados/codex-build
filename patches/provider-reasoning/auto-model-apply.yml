id: codex-build-auto-model-reasoning-confirmation
language: Rust
message: Use provider confirmation metadata when selecting an auto model.
rule:
  pattern: |-
    let requires_advanced_selection =
        Self::is_advanced_reasoning_effort(&preset.default_reasoning_effort)
            || preset
                .supported_reasoning_efforts
                .iter()
                .any(|option| Self::is_advanced_reasoning_effort(&option.effort));
fix: |-
  let requires_advanced_selection = Self::reasoning_effort_requires_confirmation(
      &preset,
      &preset.default_reasoning_effort,
  ) || preset.supported_reasoning_efforts.iter().any(|option| {
      Self::reasoning_effort_requires_confirmation(&preset, &option.effort)
  });
