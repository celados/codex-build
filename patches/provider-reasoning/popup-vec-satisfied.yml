id: codex-build-reasoning-confirmation-popup-vec-defaults-satisfied
language: Rust
message: The reasoning popup vec fixture carries confirmation defaults.
rule:
  all:
    - kind: token_tree
    - regex: '(?s)^\[\s*ReasoningEffortPreset\s*\{\s*effort:\s*ReasoningEffortConfig::High,\s*description:\s*"High reasoning"\.to_string\(\),\s*requires_confirmation:\s*None,\s*\},\s*ReasoningEffortPreset\s*\{\s*effort:\s*ReasoningEffortConfig::Ultra,\s*description:\s*"Ultra reasoning"\.to_string\(\),\s*requires_confirmation:\s*None,\s*\},\s*\]$'
