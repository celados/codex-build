id: codex-build-reasoning-confirmation-helper
language: Rust
message: Resolve confirmation metadata with the legacy Max and Ultra fallback.
rule:
  all:
    - pattern: impl ChatWidget { $$$METHODS }
    - has:
        pattern: |-
          pub(super) fn is_advanced_reasoning_effort(effort: &ReasoningEffortConfig) -> bool {
              $$$BODY
          }
        stopBy: end
    - not:
        has:
          regex: 'reasoning_effort_requires_confirmation'
          stopBy: end
fix: |-
  impl ChatWidget {
      $$$METHODS

      pub(super) fn reasoning_effort_requires_confirmation(
          preset: &ModelPreset,
          effort: &ReasoningEffortConfig,
      ) -> bool {
          preset
              .supported_reasoning_efforts
              .iter()
              .find(|option| &option.effort == effort)
              .and_then(|option| option.requires_confirmation)
              // Older catalogs rely on Codex's built-in guard for expensive tiers.
              .unwrap_or_else(|| Self::is_advanced_reasoning_effort(effort))
      }
  }
