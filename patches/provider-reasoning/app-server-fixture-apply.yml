id: codex-build-app-server-reasoning-confirmation-fixture
language: Rust
message: Keep model/list expectations aligned with confirmation metadata.
rule:
  pattern: |-
    ReasoningEffortOption {
        reasoning_effort: preset.effort.clone(),
        description: preset.description.clone(),
    }
fix: |-
  ReasoningEffortOption {
      reasoning_effort: preset.effort.clone(),
      description: preset.description.clone(),
      requires_confirmation: preset.requires_confirmation,
  }
