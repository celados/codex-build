id: codex-build-reasoning-shortcut-preset-borrow
language: Rust
message: Keep the preset available for its provider confirmation metadata.
rule:
  pattern: |-
    let current_effort = if choices.contains(&configured_effort) {
        configured_effort
    } else if choices.contains(&preset.default_reasoning_effort) {
        preset.default_reasoning_effort
    } else {
        choices
            .first()
            .cloned()
            .unwrap_or(preset.default_reasoning_effort)
    };
fix: |-
  let current_effort = if choices.contains(&configured_effort) {
      configured_effort
  } else if choices.contains(&preset.default_reasoning_effort) {
      preset.default_reasoning_effort.clone()
  } else {
      choices
          .first()
          .cloned()
          .unwrap_or_else(|| preset.default_reasoning_effort.clone())
  };
