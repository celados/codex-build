id: codex-build-reasoning-confirmation-high-vec-default
language: Rust
message: Preserve confirmation defaults in the single-effort fixture.
rule:
  all:
    - kind: token_tree
    - regex: '(?s)^\[\s*ReasoningEffortPreset\s*\{\s*effort:\s*ReasoningEffortConfig::High,\s*description:\s*"Greater reasoning depth for complex or ambiguous problems"\.to_string\(\),\s*\}\s*\]$'
fix: |-
  [ReasoningEffortPreset {
      effort: ReasoningEffortConfig::High,
      description: "Greater reasoning depth for complex or ambiguous problems".to_string(),
      requires_confirmation: None,
  }]
