id: codex-build-reasoning-confirmation-shortcut-tests
language: Rust
message: Cover safe defaults and provider opt-out for reasoning shortcuts.
rule:
  all:
    - pattern: |-
        async fn reasoning_up_shortcut_does_not_silently_enter_advanced_effort() {
            $$$BODY
        }
    - not:
        has:
          regex: 'requires_confirmation:\s*Some\(false\)'
          stopBy: end
fix: |-
  async fn reasoning_up_shortcut_does_not_silently_enter_advanced_effort() {
      $$$BODY

      let (mut chat, mut rx, _op_rx) = make_chatwidget_manual(Some("gpt-5.4")).await;
      chat.thread_id = Some(ThreadId::new());
      let mut preset = get_available_model(&chat, "gpt-5.4");
      preset.supported_reasoning_efforts.push(ReasoningEffortPreset {
          effort: ReasoningEffortConfig::Max,
          description: "Provider max reasoning".to_string(),
          requires_confirmation: Some(false),
      });
      chat.model_catalog = std::sync::Arc::new(ModelCatalog::new(vec![preset]));
      chat.set_reasoning_effort(Some(ReasoningEffortConfig::XHigh));
      while rx.try_recv().is_ok() {}

      chat.handle_key_event(KeyEvent::new(KeyCode::Char('.'), KeyModifiers::ALT));

      let events = std::iter::from_fn(|| rx.try_recv().ok()).collect::<Vec<_>>();
      assert!(events.iter().any(|event| matches!(
          event,
          AppEvent::UpdateReasoningEffort(Some(ReasoningEffortConfig::Max))
      )));
  }
