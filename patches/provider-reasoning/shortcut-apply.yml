id: codex-build-reasoning-shortcut-confirmation-gate
language: Rust
message: Gate reasoning shortcuts using provider confirmation metadata.
rule:
  pattern: |-
    if direction == ReasoningShortcutDirection::Raise
        && Self::is_advanced_reasoning_effort(&next_effort)
    {
        $$$BODY
    }
fix: |-
  if direction == ReasoningShortcutDirection::Raise
      && Self::reasoning_effort_requires_confirmation(&preset, &next_effort)
  {
      $$$BODY
  }
