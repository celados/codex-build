id: codex-build-advanced-reasoning-popup-default-confirmation
language: Rust
message: Apply provider confirmation metadata to a default-only reasoning choice.
rule:
  pattern: |-
    if choices.is_empty()
        && Self::is_advanced_reasoning_effort(&preset.default_reasoning_effort)
    {
        choices.push(preset.default_reasoning_effort.clone());
    }
fix: |-
  if choices.is_empty()
      && Self::reasoning_effort_requires_confirmation(
          &preset,
          &preset.default_reasoning_effort,
      )
  {
      choices.push(preset.default_reasoning_effort.clone());
  }
