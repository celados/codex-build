id: codex-build-reasoning-confirmation-max-vec-default
language: Rust
message: Preserve confirmation defaults in the Max selection fixture.
rule:
  all:
    - kind: token_tree
    - regex: '(?s)^\[\s*ReasoningEffortPreset\s*\{\s*effort:\s*ReasoningEffortConfig::Max,\s*description:\s*"Maximum reasoning"\.to_string\(\),\s*\}\s*\]$'
fix: |-
  [ReasoningEffortPreset {
      effort: ReasoningEffortConfig::Max,
      description: "Maximum reasoning".to_string(),
      requires_confirmation: None,
  }]
