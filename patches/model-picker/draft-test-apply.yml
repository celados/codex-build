id: codex-build-model-picker-draft-test
language: Rust
message: Cover draft preservation when the model picker shortcut opens.
rule:
  pattern: |-
    async fn model_picker_hides_show_in_picker_false_models_from_cache() {
        $$$BODY
    }
fix: |-
  async fn model_picker_filters_hidden_models_and_shortcut_preserves_draft() {
      $$$BODY

      let (mut chat, mut rx, _op_rx) = make_chatwidget_manual(Some("gpt-5.4")).await;
      chat.thread_id = Some(ThreadId::new());
      let mut preset = get_available_model(&chat, "gpt-5.4");
      preset.show_in_picker = true;
      preset.default_reasoning_effort = ReasoningEffortConfig::Medium;
      preset.supported_reasoning_efforts = vec![
          ReasoningEffortPreset {
              effort: ReasoningEffortConfig::Low,
              description: "Low".to_string(),
              requires_confirmation: None,
          },
          ReasoningEffortPreset {
              effort: ReasoningEffortConfig::Medium,
              description: "Medium".to_string(),
              requires_confirmation: None,
          },
          ReasoningEffortPreset {
              effort: ReasoningEffortConfig::High,
              description: "High".to_string(),
              requires_confirmation: None,
          },
          ReasoningEffortPreset {
              effort: ReasoningEffortConfig::Max,
              description: "Provider max".to_string(),
              requires_confirmation: Some(false),
          },
      ];
      chat.model_catalog = std::sync::Arc::new(ModelCatalog::new(vec![preset]));
      chat.set_reasoning_effort(Some(ReasoningEffortConfig::Medium));
      while rx.try_recv().is_ok() {}
      chat.bottom_pane.set_composer_text(
          "keep this draft".to_string(),
          Vec::new(),
          Vec::new(),
      );

      chat.handle_key_event(KeyEvent::new(KeyCode::Char('p'), KeyModifiers::ALT));

      assert_eq!(chat.bottom_pane.composer_text(), "keep this draft");
      let popup = render_bottom_popup(&chat, /*width*/ 80);
      insta::assert_snapshot!(
          popup,
          @r###"
            Model

            Search models
          › gpt-5.4 (current)  low · MEDIUM · high · max

            enter confirm   ← → effort   esc
          "###
      );
      assert!(popup.contains("Model"));
      assert!(popup.contains("low · MEDIUM · high · max"));

      chat.handle_key_event(KeyEvent::from(KeyCode::Right));
      chat.handle_key_event(KeyEvent::from(KeyCode::Right));
      chat.handle_key_event(KeyEvent::from(KeyCode::Enter));

      let events = std::iter::from_fn(|| rx.try_recv().ok()).collect::<Vec<_>>();
      assert!(events.iter().any(|event| matches!(
          event,
          AppEvent::UpdateReasoningEffort(Some(ReasoningEffortConfig::Max))
      )));
      assert!(events.iter().any(|event| matches!(
          event,
          AppEvent::PersistModelSelection {
              model,
              effort: Some(ReasoningEffortConfig::Max),
          } if model == "gpt-5.4"
      )));
      assert_eq!(chat.bottom_pane.composer_text(), "keep this draft");
  }

  #[tokio::test]
  async fn custom_model_picker_does_not_bypass_required_confirmation() {
      let (mut chat, _rx, _op_rx) = make_chatwidget_manual(Some("gpt-5.4")).await;
      chat.thread_id = Some(ThreadId::new());
      let mut preset = get_available_model(&chat, "gpt-5.4");
      preset.show_in_picker = true;
      preset.default_reasoning_effort = ReasoningEffortConfig::Medium;
      preset.supported_reasoning_efforts = vec![
          ReasoningEffortPreset {
              effort: ReasoningEffortConfig::Medium,
              description: "Medium".to_string(),
              requires_confirmation: None,
          },
          ReasoningEffortPreset {
              effort: ReasoningEffortConfig::Max,
              description: "Maximum".to_string(),
              requires_confirmation: None,
          },
      ];
      chat.model_catalog = std::sync::Arc::new(ModelCatalog::new(vec![preset]));
      chat.set_reasoning_effort(Some(ReasoningEffortConfig::Medium));

      chat.open_custom_model_picker();

      let popup = render_bottom_popup(&chat, /*width*/ 80);
      assert!(popup.contains("MEDIUM"));
      assert!(!popup.contains("max"));
  }
