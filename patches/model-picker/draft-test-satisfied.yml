id: codex-build-model-picker-draft-test-satisfied
language: Rust
message: The model picker shortcut preserves a draft and exposes the full effort ladder.
rule:
  all:
    - pattern: |-
        async fn model_picker_filters_hidden_models_and_shortcut_preserves_draft() {
            $$$BODY
        }
    - has:
        regex: 'low · MEDIUM · high · max'
        stopBy: end
    - has:
        pattern: "KeyEvent::new(KeyCode::Char('p'), KeyModifiers::ALT)"
        stopBy: end
