id: codex-build-model-picker-action-binding-inventory
language: Rust
message: Register the model picker in the shared action binding inventory.
rule:
  all:
    - kind: token_tree
    - regex: '(?s)^\[\s*interrupt_turn,\s*decrease_reasoning_effort,\s*increase_reasoning_effort,\s*previous_permission_mode,\s*next_permission_mode,\s*edit_queued_message,\s*\]$'
fix: |-
  [
      interrupt_turn,
      decrease_reasoning_effort,
      increase_reasoning_effort,
      open_model_picker,
      previous_permission_mode,
      next_permission_mode,
      edit_queued_message,
  ]
