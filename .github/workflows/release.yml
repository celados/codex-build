name: Build and release Codex

on:
  schedule:
    # GitHub cron uses UTC. Run once daily, away from the top-of-hour queue.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: Rebuild even when the latest upstream tag is already released
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: codex-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 6
      # Disk safety outranks build speed on the shared Mac mini runner.
      CARGO_INCREMENTAL: 0
      # Keep Cargo's registry download cache inside the disposable job tree;
      # ~/.cargo remains only the runner-owned rustup executable location.
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out builder
        uses: actions/checkout@v7
        with:
          # A cancelled or killed job can miss the explicit cleanup below.
          # Checkout cleanup also bounds stale ignored artifacts to one run.
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release versions
        id: release
        env:
          FORCE_RELEASE: ${{ inputs.force_release || false }}
        run: python3 scripts/resolve-release.py

      - name: Prepare cold runner
        if: steps.release.outputs.release == 'true'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          brew install ast-grep
          # Build from a fresh upstream checkout every release. The runner is
          # shared storage, so intentionally do not retain Cargo or V8 state.
          rm -rf dist sources .cargo-home .v8-cache

      - name: Verify patch applicability
        if: steps.release.outputs.release == 'true'
        run: ./build.sh --check --upstream-ref "${{ steps.release.outputs.upstream_tag }}"

      - name: Build and smoke-test
        if: steps.release.outputs.release == 'true'
        run: ./build.sh --upstream-ref "${{ steps.release.outputs.upstream_tag }}" --version "${{ steps.release.outputs.version }}"

      - name: Write provenance
        if: steps.release.outputs.release == 'true'
        run: |
          python3 scripts/write-provenance.py \
            --output dist/provenance.json \
            --version "${{ steps.release.outputs.version }}" \
            --upstream-tag "${{ steps.release.outputs.upstream_tag }}" \
            --upstream-commit "$(git -C sources rev-parse HEAD)" \
            --builder-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"

      - name: Publish release
        if: steps.release.outputs.release == 'true'
        run: |
          gh release create "${{ steps.release.outputs.release_tag }}" \
            dist/codex-aarch64-apple-darwin.tar.gz \
            dist/codex-aarch64-apple-darwin.tar.gz.sha256 \
            dist/provenance.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Codex ${{ steps.release.outputs.version }}" \
            --notes "Custom macOS arm64 build of upstream ${{ steps.release.outputs.upstream_tag }}."

      - name: Remove build workspace
        if: always()
        run: |
          # checkout's post step tolerates a missing repository and only warns;
          # leave its cwd before removing the shared runner's project tree.
          cd "$RUNNER_TEMP"
          rm -rf \
            "$GITHUB_WORKSPACE/sources" \
            "$GITHUB_WORKSPACE/dist" \
            "$GITHUB_WORKSPACE/.cargo-home" \
            "$GITHUB_WORKSPACE/.v8-cache"
          rm -rf "$GITHUB_WORKSPACE"
          rmdir "$(dirname "$GITHUB_WORKSPACE")" 2>/dev/null || true
