name: Build and release Codex

on:
  schedule:
    # GitHub cron uses UTC. 20:17 UTC is 04:17 the next day in Asia/Shanghai.
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: Rebuild even when the latest upstream tag is already released
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: codex-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 6
      # Disk safety outranks build speed on the shared Mac mini runner.
      CARGO_INCREMENTAL: 0
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Clone disposable builder
        run: |
          set -euo pipefail
          builder="$RUNNER_TEMP/codex-builder"
          tool_cache="${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is required}"
          cache_root="$tool_cache/codex-build"

          cd "$RUNNER_TEMP"
          # A runner that has not executed the cold-build workflow may still carry the
          # old persistent checkout, so reclaim it before allocating another full build.
          rm -rf -- "$GITHUB_WORKSPACE"
          rm -rf -- "$builder"
          git clone --depth=1 --filter=blob:none \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$builder"
          # A new main commit can race the schedule; build the exact run SHA.
          git -C "$builder" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$builder" checkout --detach FETCH_HEAD
          # Cargo never garbage-collects old hash generations. Daily no-op runs
          # still enforce the persistent cache ceilings.
          "$builder/scripts/manage-runner-cache.sh" trim "$tool_cache"
          echo "CARGO_HOME=$cache_root/cargo-home" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cache_root/target" >> "$GITHUB_ENV"
          echo "CODEX_BUILD_V8_CACHE_DIR=$cache_root/v8-cache" >> "$GITHUB_ENV"

      - name: Resolve release versions
        id: release
        working-directory: ${{ runner.temp }}/codex-builder
        env:
          FORCE_RELEASE: ${{ inputs.force_release || false }}
        run: python3 scripts/resolve-release.py

      - name: Prepare build runner
        if: steps.release.outputs.release == 'true'
        working-directory: ${{ runner.temp }}/codex-builder
        run: |
          # Space gating belongs only to real builds; an unchanged upstream tag
          # remains a successful no-op even when the runner has little free space.
          ./scripts/manage-runner-cache.sh prepare "${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is required}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          brew install ast-grep
          # Source and release output stay disposable; only the bounded caches
          # prepared above survive on the shared runner.

      - name: Verify patch applicability
        if: steps.release.outputs.release == 'true'
        working-directory: ${{ runner.temp }}/codex-builder
        run: ./build.sh --check --upstream-ref "${{ steps.release.outputs.upstream_tag }}"

      - name: Build and smoke-test
        if: steps.release.outputs.release == 'true'
        working-directory: ${{ runner.temp }}/codex-builder
        run: ./build.sh --upstream-ref "${{ steps.release.outputs.upstream_tag }}" --version "${{ steps.release.outputs.version }}"

      - name: Write provenance
        if: steps.release.outputs.release == 'true'
        working-directory: ${{ runner.temp }}/codex-builder
        run: |
          python3 scripts/write-provenance.py \
            --output dist/provenance.json \
            --version "${{ steps.release.outputs.version }}" \
            --upstream-tag "${{ steps.release.outputs.upstream_tag }}" \
            --upstream-commit "$(git -C sources rev-parse HEAD)" \
            --builder-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"

      - name: Publish release
        if: steps.release.outputs.release == 'true'
        working-directory: ${{ runner.temp }}/codex-builder
        run: |
          gh release create "${{ steps.release.outputs.release_tag }}" \
            dist/codex-aarch64-apple-darwin.tar.gz \
            dist/codex-aarch64-apple-darwin.tar.gz.sha256 \
            dist/provenance.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Codex ${{ steps.release.outputs.version }}" \
            --notes "Custom macOS arm64 build of upstream ${{ steps.release.outputs.upstream_tag }}."

      - name: Remove build workspace
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          set -u
          builder="$RUNNER_TEMP/codex-builder"
          tool_cache="${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is required}"
          cache_status=0
          # Trim after failures as well: interrupted compilers are exactly when stale
          # generations would otherwise escape the pre-build size bound.
          if [[ -x "$builder/scripts/manage-runner-cache.sh" ]]; then
            "$builder/scripts/manage-runner-cache.sh" trim "$tool_cache" || cache_status=$?
          fi
          # No checkout action follows this step, so its workspace can be
          # removed without breaking a post-action working directory.
          cd "$RUNNER_TEMP"
          rm -rf -- "$builder"
          rm -rf -- "$GITHUB_WORKSPACE"
          rmdir "$(dirname "$GITHUB_WORKSPACE")" 2>/dev/null || true
          exit "$cache_status"
